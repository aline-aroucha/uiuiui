name: Component checks

# The merge checklist (docs/component-checklist.md) for every component, on each pull request and push to main.
# Make it required in Settings > Branches > Branch protection so a failing component can't be merged.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static checks
        run: npm run check:component -- --all
      - run: npm run build
      - name: Install Playwright and Chromium
        run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Rendered checks (axe, keyboard, reflow, reduced motion)
        run: npm run check:a11y -- --all
